name: Release WinDeck

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android APK
        working-directory: ./android
        run: |
          flutter pub get
          flutter build apk --release
          mkdir ../Releases
          copy build\app\outputs\flutter-apk\app-release.apk ..\Releases\WinDeck_App.apk

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Executable
        working-directory: ./server-dotnet/WinDeckServer
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../../Releases/
          Rename-Item ../../Releases/WinDeckServer.exe WinDeck_Server_Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Releases/WinDeck_App.apk
            Releases/WinDeck_Server_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
