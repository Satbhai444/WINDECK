<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - WinDeck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000; color: #f5f5f7; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-glow { box-shadow: 0 0 20px rgba(94, 106, 210, 0.4); }
        .btn-glow:hover { box-shadow: 0 0 35px rgba(94, 106, 210, 0.7); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <header class="h-14 border-b border-white/10 glass-panel flex items-center px-6">
        <a href="index.html" class="text-[16px] font-bold tracking-tight text-white hover:opacity-80">← Back to Win<span class="text-[#5E6AD2]">Deck</span></a>
    </header>

    <main class="flex-1 max-w-2xl mx-auto px-6 py-20 w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4">Contact Me</h1>
            <p class="text-[18px] text-white/50">
                Have a question, feedback, or a feature request? Drop me a message below.
            </p>
        </div>

        <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
            <!-- Replace with your Access Key -->
            <input type="hidden" name="access_key" value="2e75aedd-3223-402d-aa18-541ad2412cd9">
            <input type="hidden" name="subject" value="New Contact Message from WinDeck Website">
            <input type="hidden" name="redirect" value="https://windeck.vercel.app">

            <div>
                <label for="name" class="block text-sm font-medium text-white/70 mb-2">Name</label>
                <input type="text" name="name" id="name" required class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#5E6AD2]/60 focus:ring-1 focus:ring-[#5E6AD2]/60 transition-colors">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-white/70 mb-2">Email Address</label>
                <input type="email" name="email" id="email" required class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#5E6AD2]/60 focus:ring-1 focus:ring-[#5E6AD2]/60 transition-colors">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-white/70 mb-2">Message</label>
                <textarea name="message" id="message" rows="5" required class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#5E6AD2]/60 focus:ring-1 focus:ring-[#5E6AD2]/60 transition-colors"></textarea>
            </div>

            <button type="submit" class="w-full py-4 rounded-xl bg-[#5E6AD2] text-white font-bold text-center hover:bg-[#4f5bc4] transition-colors btn-glow text-[15px]">
                Send Message
            </button>
        </form>
    </main>
</body>
</html>
